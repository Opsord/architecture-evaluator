name: Docker Build & Smoke Test

on:
  push:
    branches:
      - main
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/pom.xml'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/docker.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docker-compose.yml'
      - 'backend/Dockerfile'
      - 'backend/.dockerignore'
      - 'backend/pom.xml'
      - 'frontend/Dockerfile'
      - 'frontend/package.json'
      - 'frontend/pnpm-lock.yaml'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docker-smoke-test:
    name: Build images and run E2E smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker Compose stack
        run: docker compose build

      - name: Start Docker Compose stack and wait for healthy services
        run: docker compose up -d --wait

      - name: Smoke test frontend SPA and Nginx API proxy
        run: |
          set -euo pipefail

          # 1. Verify frontend SPA is served by Nginx on port 80
          HTML=$(curl -fsS http://localhost/)
          grep -qi "<html" <<< "$HTML"
          echo "Frontend SPA OK"

          # 2. Build a minimal Spring Boot project ZIP (>1 MB incompressible) and analyze it through Nginx /api/ proxy
          TMP_DIR=$(mktemp -d)
          trap 'rm -rf "$TMP_DIR"' EXIT
          mkdir -p "$TMP_DIR/demo/src/main/java/com/example/demo"
          cat > "$TMP_DIR/demo/pom.xml" <<'EOF'
          <project>
            <groupId>com.example</groupId>
            <artifactId>demo</artifactId>
            <version>1.0.0</version>
            <properties>
              <java.version>21</java.version>
            </properties>
          </project>
          EOF
          cat > "$TMP_DIR/demo/src/main/java/com/example/demo/HelloService.java" <<'EOF'
          package com.example.demo;
          import org.springframework.stereotype.Service;

          @Service
          public class HelloService {
              private String greeting = "hi";
              public String sayHello() { return greeting; }
          }
          EOF
          # Add 2 MB of incompressible data to ensure the resulting ZIP exceeds Nginx's default 1 MB limit
          dd if=/dev/urandom of="$TMP_DIR/demo/payload.bin" bs=1M count=2 status=none
          (cd "$TMP_DIR" && zip -qr smoke-project.zip demo)

          ZIP_SIZE=$(stat -c%s "$TMP_DIR/smoke-project.zip")
          echo "Generated smoke-project.zip size: ${ZIP_SIZE} bytes"
          if [ "$ZIP_SIZE" -le 1048576 ]; then
            echo "Expected smoke-project.zip to exceed 1 MB (1048576 bytes)"
            exit 1
          fi

          RESPONSE=$(curl -fsS -X POST -F "project=@$TMP_DIR/smoke-project.zip" http://localhost/api/orchestrator/analyze-upload)
          grep -q '"qualifiedName":"com.example.demo.HelloService"' <<< "$RESPONSE"
          echo "End-to-end /api/orchestrator/analyze-upload (>1 MB) through Nginx OK"

      - name: Dump container logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v
