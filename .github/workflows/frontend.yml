name: Frontend CI & SonarCloud

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

jobs:
  build:
    name: Build and analyze frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Enable Corepack and pnpm
        run: corepack enable && corepack prepare pnpm@10.15.1 --activate
      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Build production bundle
        working-directory: frontend
        run: pnpm run build
      - name: SonarCloud scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_FRONT }}
        with:
          projectBaseDir: frontend
          args: >
            -Dsonar.organization=opsord
            -Dsonar.projectKey=opsord_architecture-evaluator-frontend
            -Dsonar.projectName="Architecture Evaluator - Frontend"
            -Dsonar.sources=src
            -Dsonar.exclusions=**/MockData/**,**/*.d.ts
