services:
  # Backend service (Spring Boot)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: architecture-evaluator-backend
    expose:
      - "8080"
    environment:
      - SERVER_PORT=8080
    networks:
      - architecture-evaluator-network
    restart: unless-stopped

  # Frontend service (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: architecture-evaluator-frontend
    ports:
      - "80:80"
    networks:
      - architecture-evaluator-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  architecture-evaluator-network:
    driver: bridge
